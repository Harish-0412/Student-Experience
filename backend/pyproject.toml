[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "astrapath-backend"
version = "0.5.0"
description = "AstraPath Phase 1-5 agentic learning backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langgraph>=0.6,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "sqlalchemy>=2.0.36,<3.0",
  "temporalio>=1.16,<2.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<1.20",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
astrapath-admin = "astrapath.scripts.create_admin:main"
astrapath-load = "astrapath.phase5.load:main"

[tool.hatch.build.targets.wheel]
packages = ["src/astrapath"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings -p no:langsmith"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
exclude = ["migrations"]
